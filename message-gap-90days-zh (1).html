<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>職場訊息斷層 — NexaCorp Workspace</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sidebar: #171A23;
    --sidebar-active: #2B3040;
    --sidebar-text: #A9AEC0;
    --sidebar-text-dim: #6D7286;
    --main-bg: #F4F5F7;
    --bubble-them: #FFFFFF;
    --bubble-me: #2F6FEF;
    --accent: #2F6FEF;
    --accent-soft: #E8F0FF;
    --border: #E4E6EB;
    --ink: #1B1E28;
    --ink-soft: #6B7080;
    --success: #1AA36A;
    --warn: #E0862A;
    --danger: #E14C4C;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100vh;
    font-family:'Noto Sans TC', sans-serif;
    background: var(--main-bg);
    color: var(--ink);
    overflow:hidden;
  }
  .app{ display:flex; height:100vh; max-width:1000px; margin:0 auto; box-shadow:0 0 0 1px var(--border); background:#fff; }
  .sidebar{ width:230px; flex-shrink:0; background:var(--sidebar); color:var(--sidebar-text); display:flex; flex-direction:column; padding:14px 0; overflow-y:auto; }
  .ws-name{ font-weight:700; font-size:0.95rem; color:#fff; padding:4px 16px 14px; display:flex; align-items:center; gap:8px; }
  .ws-name .dot{ width:8px;height:8px;border-radius:50%; background:var(--success); }
  .sb-section{ font-size:0.66rem; letter-spacing:0.5px; color:var(--sidebar-text-dim); padding:10px 16px 4px; text-transform:uppercase; font-weight:700; }
  .sb-item{ display:flex; align-items:center; gap:8px; padding:6px 16px; font-size:0.8rem; color:var(--sidebar-text); cursor:pointer; transition:background 0.12s; }
  .sb-item:hover{ background:rgba(255,255,255,0.06); border-radius:0 20px 20px 0; margin-right:10px; }
  .sb-item.active{ background:var(--sidebar-active); color:#fff; border-radius:0 20px 20px 0; margin-right:10px; }
  .sb-avatar{ width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:0.6rem; font-weight:700; color:#fff; flex-shrink:0; }
  .sb-item .hash{ width:22px; text-align:center; color:var(--sidebar-text-dim); font-weight:700; }

  .main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar{ padding:12px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .topbar .who{ display:flex; align-items:center; gap:10px; }
  .topbar .who .name{ font-weight:700; font-size:0.95rem; }
  .topbar .who .sub{ font-size:0.72rem; color:var(--ink-soft); }
  .daybox{ text-align:right; }
  .daybox .label{ font-size:0.7rem; color:var(--ink-soft); font-weight:600; }
  .progress-track{ width:140px; height:5px; background:#E9EBF0; border-radius:3px; margin-top:4px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--accent); border-radius:3px; transition:width 0.5s ease; }

  .log{ flex:1; overflow-y:auto; padding:18px 22px; display:flex; flex-direction:column; gap:4px; transition:opacity 0.15s ease; }
  .log.switching{ opacity:0; }
  .thread-divider{ align-self:center; font-size:0.68rem; color:var(--ink-soft); background:#EDEFF3; padding:3px 12px; border-radius:20px; margin:6px 0 10px; }

  .msg-row{ display:flex; gap:10px; max-width:82%; animation: rise 0.28s ease; }
  .msg-row.them{ align-self:flex-start; }
  .msg-row.me{ align-self:flex-end; flex-direction:row-reverse; }
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .msg-avatar{ width:32px; height:32px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:0.7rem; font-weight:700; color:#fff; margin-top:2px; }
  .msg-body{ display:flex; flex-direction:column; }
  .msg-meta{ font-size:0.72rem; color:var(--ink-soft); margin-bottom:3px; display:flex; gap:6px; }
  .msg-row.me .msg-meta{ justify-content:flex-end; }
  .msg-meta .nm{ font-weight:700; color:var(--ink); }
  .bubble{ background:var(--bubble-them); border:1px solid var(--border); padding:9px 13px; border-radius:4px 14px 14px 14px; font-size:0.88rem; line-height:1.6; box-shadow:0 1px 2px rgba(0,0,0,0.03); white-space:pre-line; }
  .msg-row.me .bubble{ background:var(--bubble-me); color:#fff; border:none; border-radius:14px 4px 14px 14px; }

  .typing-row{ display:flex; gap:10px; align-items:center; }
  .typing-dots{ background:var(--bubble-them); border:1px solid var(--border); padding:10px 14px; border-radius:4px 14px 14px 14px; display:flex; gap:4px; }
  .typing-dots span{ width:6px; height:6px; border-radius:50%; background:#B7BBC6; animation:bounce 1.1s infinite; }
  .typing-dots span:nth-child(2){ animation-delay:0.15s; }
  .typing-dots span:nth-child(3){ animation-delay:0.3s; }
  @keyframes bounce{ 0%,60%,100%{transform:translateY(0); opacity:0.5;} 30%{transform:translateY(-4px); opacity:1;} }

  .read-receipt{ align-self:flex-end; font-size:0.66rem; color:var(--ink-soft); margin:-2px 4px 8px 0; }
  .narration{ align-self:center; max-width:90%; background:rgba(255,255,255,0.55); border:1px dashed #C7CBD6; color:var(--ink-soft); font-style:italic; font-size:0.78rem; line-height:1.7; padding:9px 16px; border-radius:10px; text-align:center; margin:8px 0; }
  .call-notif{ align-self:center; display:flex; align-items:center; gap:6px; background:#EEF0F4; color:var(--ink-soft); font-size:0.72rem; padding:6px 14px; border-radius:20px; margin:6px 0; }
  .call-notif .icon{ color:var(--accent); }
  .screenshot-card{ width:220px; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:#fff; cursor:zoom-in; }
  .screenshot-card .ss-fake{ background:linear-gradient(135deg,#EEF1F6,#DDE3EC); height:110px; display:flex; align-items:center; justify-content:center; color:#9AA3B2; font-size:0.68rem; }
  .screenshot-card .ss-caption{ padding:6px 10px; font-size:0.7rem; color:var(--ink-soft); border-top:1px solid var(--border); }
  .lightbox{ display:none; position:fixed; inset:0; background:rgba(10,12,20,0.72); align-items:center; justify-content:center; z-index:60; cursor:zoom-out; padding:20px; }
  .lightbox.show{ display:flex; }
  .lightbox-inner{ background:#fff; border-radius:14px; padding:16px; width:340px; max-width:100%; }
  .lightbox-inner .ss-caption{ white-space:pre-line; font-size:0.8rem; line-height:1.7; color:var(--ink); padding-top:10px; }
  .silence-pad{ align-self:center; height:38px; display:flex; align-items:center; justify-content:center; color:#C4C9D3; font-size:0.72rem; letter-spacing:2px; }

  .choices{ padding:6px 22px 18px; display:flex; flex-direction:column; gap:8px; flex-shrink:0; border-top:1px solid var(--border); }
  .choices .prompt{ font-size:0.72rem; color:var(--ink-soft); font-weight:600; margin:8px 0 2px; }
  .choice-btn{ text-align:left; background:#fff; border:1.5px solid var(--border); border-radius:10px; padding:10px 14px; font-size:0.86rem; color:var(--ink); cursor:pointer; font-family:inherit; transition:border-color 0.15s, background 0.15s, transform 0.08s; }
  .choice-btn:hover{ border-color:var(--accent); background:var(--accent-soft); transform:translateY(-1px); }
  .choice-btn:disabled{ opacity:0.4; pointer-events:none; }
  .choices.hidden{ display:none; }

  .continue-wrap{ padding:10px 22px 20px; border-top:1px solid var(--border); flex-shrink:0; }
  .continue-btn{ width:100%; background:var(--accent); color:#fff; border:none; padding:12px; border-radius:10px; font-size:0.9rem; font-weight:700; cursor:pointer; font-family:inherit; }
  .continue-btn:hover{ background:#255dd0; }

  .stats-panel{ display:none; padding:8px 20px; border-top:1px solid var(--border); background:#FAFBFC; flex-wrap:wrap; gap:6px; }
  .stats-panel.show{ display:flex; }
  .stats-chip{ font-size:0.66rem; color:var(--ink-soft); background:#EEF0F4; padding:3px 9px; border-radius:10px; }

  .overlay{ display:none; position:fixed; inset:0; background:rgba(10,12,20,0.55); align-items:center; justify-content:center; z-index:50; }
  .overlay.show{ display:flex; }
  .notif-card{ width:400px; max-width:90vw; background:#fff; border-radius:16px; box-shadow:0 24px 60px rgba(0,0,0,0.35); overflow:hidden; animation:notifIn 0.4s cubic-bezier(.2,1,.3,1); }
  @keyframes notifIn{ from{opacity:0; transform:translateY(-14px) scale(0.97);} to{opacity:1; transform:none;} }
  .notif-head{ display:flex; align-items:center; gap:10px; padding:14px 16px 10px; }
  .notif-app-icon{ width:34px; height:34px; border-radius:9px; background:var(--accent); color:#fff; font-weight:900; font-size:0.85rem; display:flex; align-items:center; justify-content:center; }
  .notif-app-name{ font-size:0.78rem; font-weight:700; color:var(--ink); }
  .notif-time{ font-size:0.68rem; color:var(--ink-soft); margin-left:auto; }
  .notif-body{ padding:0 16px 6px; }
  .notif-title{ font-size:0.95rem; font-weight:700; margin-bottom:4px; }
  .notif-text{ font-size:0.84rem; line-height:1.75; color:#333; white-space:pre-line; }
  .notif-quote{ font-size:0.86rem; font-weight:700; color:var(--ink); margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); }
  .notif-stamp{ display:inline-block; margin:12px 16px 0; font-size:0.7rem; font-weight:800; letter-spacing:1px; padding:3px 10px; border-radius:20px; }
  .notif-stamp.neutral{ background:#EEF0F4; color:#666; }
  .notif-stamp.restructure{ background:#FDF0E4; color:var(--warn); }
  .notif-stamp.promoted{ background:#E3F7ED; color:var(--success); }
  .notif-stamp.resign{ background:#FCE9E9; color:var(--danger); }
  .notif-stamp.hidden{ background:#F1EAFB; color:#7B4FDB; }
  .notif-foot{ padding:16px; }
  .replay-btn{ width:100%; background:var(--ink); color:#fff; border:none; padding:11px; border-radius:9px; font-size:0.85rem; font-weight:700; cursor:pointer; font-family:inherit; }
  .replay-btn:hover{ background:#000; }

  ::-webkit-scrollbar{ width:7px; }
  ::-webkit-scrollbar-thumb{ background:#D6D9E0; border-radius:4px; }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="ws-name"><span class="dot"></span>NexaCorp Workspace</div>
    <div class="sb-section">頻道</div>
    <div class="sb-item" id="sb-team" data-contact="team"><span class="hash">#</span>mkt-team</div>
    <div class="sb-item" id="sb-crossdept" data-contact="crossdept"><span class="hash">#</span>cross-dept-monthly</div>
    <div class="sb-item" id="sb-leadership" data-contact="leadership"><span class="hash">#</span>mkt-leadership</div>
    <div class="sb-section">群組</div>
    <div class="sb-item" id="sb-trio" data-contact="trio"><span class="sb-avatar" style="background:#C99A2E;">👥</span>午餐三人組</div>
    <div class="sb-section">私訊</div>
    <div class="sb-item" id="sb-alex" data-contact="alex"><span class="sb-avatar" style="background:#3B4A7A;">AC</span>Alex Chen（HO MKT）</div>
    <div class="sb-item" id="sb-ken" data-contact="ken"><span class="sb-avatar" style="background:#D97B29;">KW</span>Ken Wu（Senior MKT Lead）</div>
    <div class="sb-item" id="sb-sophie" data-contact="sophie"><span class="sb-avatar" style="background:#8C5FD6;">SL</span>Sophie Laurent（MKT）</div>
    <div class="sb-item" id="sb-grace" data-contact="grace"><span class="sb-avatar" style="background:#1AA36A;">GL</span>Grace Lin（MKT）</div>
    <div class="sb-item" id="sb-leo" data-contact="leo"><span class="sb-avatar" style="background:#2E9AA6;">LT</span>Leo Tan（MKT）</div>
    <div class="sb-item" id="sb-tom" data-contact="tom"><span class="sb-avatar" style="background:#D64D8A;">TM</span>Tom（MKT）</div>
    <div class="sb-item" id="sb-joyce" data-contact="joyce"><span class="sb-avatar" style="background:#6B7A99;">JT</span>Joyce Tam（Finance）</div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="who">
        <span class="sb-avatar" id="topAvatar" style="background:#3B4A7A;">AC</span>
        <div>
          <div class="name" id="topName">#mkt-team</div>
          <div class="sub" id="topSub">頻道</div>
        </div>
      </div>
      <div class="daybox">
        <div class="label" id="dayLabel">DAY 1 / 90</div>
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:1%;"></div></div>
      </div>
    </div>

    <div class="log" id="log"></div>
    <div class="stats-panel" id="statsPanel"></div>

    <div class="choices" id="choices"></div>
    <div class="continue-wrap" id="continueWrap" style="display:none;">
      <button class="continue-btn" id="continueBtn">繼續</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <div class="ss-fake" style="height:160px; background:linear-gradient(135deg,#EEF1F6,#DDE3EC); display:flex; align-items:center; justify-content:center; color:#9AA3B2; border-radius:8px;">🖼️ 截圖預覽</div>
    <div class="ss-caption" id="lightboxCaption"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="notif-card">
    <div class="notif-head">
      <div class="notif-app-icon">N</div>
      <div class="notif-app-name" id="notifSender">NexaCorp Workspace</div>
      <div class="notif-time">Day 90</div>
    </div>
    <div class="notif-body">
      <div class="notif-title" id="notifTitle">90 天後</div>
      <div class="notif-text" id="notifText"></div>
      <div class="notif-quote" id="notifQuote"></div>
    </div>
    <div class="notif-stamp" id="notifStamp">結果</div>
    <div class="notif-foot">
      <button class="replay-btn" id="replayBtn">重新挑戰 90 天</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   狀態
============================================================ */
let state = { like:50, wary:0, ken:40, ally:30, ext:0, helpless:0 };
let routeScore = { A:0, B:0, C:0, D:0 };
let idx = 0;
let events = [];
let routeDecided = null;
let playCount = 1;

const ME_TITLE = 'MKT Team Lead';

const CONTACTS = {
  alex:      { name:'Alex Chen',      title:'HO MKT',            sub:'HO MKT · 你的主管',   color:'#3B4A7A', initials:'AC', sb:'sb-alex' },
  ken:       { name:'Ken Wu',         title:'Senior MKT Lead',    sub:'Alex 身邊的老臣',      color:'#D97B29', initials:'KW', sb:'sb-ken' },
  sophie:    { name:'Sophie Laurent', title:'MKT',                sub:'MKT Executive',       color:'#8C5FD6', initials:'SL', sb:'sb-sophie' },
  grace:     { name:'Grace Lin',      title:'MKT',                sub:'MKT Executive',       color:'#1AA36A', initials:'GL', sb:'sb-grace' },
  leo:       { name:'Leo Tan',        title:'MKT',                sub:'MKT Executive',       color:'#2E9AA6', initials:'LT', sb:'sb-leo' },
  tom:       { name:'Tom',            title:'MKT',                sub:'MKT Executive',       color:'#D64D8A', initials:'TM', sb:'sb-tom' },
  joyce:     { name:'Joyce Tam',      title:'Finance',            sub:'Finance · 外部人脈',   color:'#6B7A99', initials:'JT', sb:'sb-joyce' },
  david:     { name:'David Chen',     title:'Cross-Dept Head',    sub:'跨部門主管',           color:'#B24444', initials:'DC' },
  team:      { name:'#mkt-team',      title:'頻道',               sub:'頻道 · 全組',          color:'#5B6472', initials:'#',  sb:'sb-team' },
  trio:      { name:'午餐三人組',      title:'群組',               sub:'你、Leo、Tom',        color:'#C99A2E', initials:'👥', sb:'sb-trio' },
  crossdept: { name:'#cross-dept-monthly', title:'頻道',          sub:'跨部門月會',           color:'#5B6472', initials:'#',  sb:'sb-crossdept' },
  leadership:{ name:'#mkt-leadership',title:'頻道',               sub:'管理層頻道',           color:'#5B6472', initials:'#',  sb:'sb-leadership' }
};

const threads = {};
Object.keys(CONTACTS).forEach(k => threads[k] = []);
let currentThread = null;

/* ============================================================
   共通事件 — 第一章：發現（Day 1–21）＋ 第二章開場（Day 22–35）
============================================================ */
const commonEvents = [

  // 場景 1-1：週一早上的郵件（Day 1）
  {
    day:1, contact:'team',
    incoming: [
      {speaker:'alex',   text:"Hi all，就如上週五我們 align 過的方向，Q3 的 campaign 主軸會從 brand awareness 轉去 conversion-focused。各位請依據這個方向更新手上的 timeline，週三前交給 Ken 彙整。謝謝 🙏"},
      {speaker:'ken',    text:"Noted，我會整理一個 template 給大家"},
      {speaker:'sophie', text:"收到！我手上那個 KOL 合作要重新 scope 嗎？"},
      {speaker:'alex',   text:"對，我們聊過的那個方向，你按那個走就好"}
    ],
    interlude: { contact:'tom', exchange:[
      {side:'me',   text:"喂 上週五有什麼 alignment meeting 嗎？我完全沒印象"},
      {side:'them', text:"我也沒有??"},
      {side:'them', text:"我以為是我漏看了 invite"},
      {side:'me',   text:"我剛 check calendar 沒有任何東西"},
      {side:'them', text:"⋯"},
      {side:'them', text:"算了問 Ken 吧"}
    ]},
    choices: [
      { label:"直接在 #mkt-team 問 Alex", sent:"Hi Alex，想 double check 一下，上週五的 alignment 有 meeting notes 嗎？想確保自己沒有 miss 什麼 context 🙏",
        fx:{like:-5}, route:'C',
        readByAfterSent:['Alex Chen','Ken Wu','Sophie Laurent','Tom','Leo Tan','Grace Lin'],
        steps:[
          {type:'msg', speaker:'ken', text:"不是正式 meeting 啦，就上週五下午 Alex 路過跟我、Sophie 聊了一下大方向。我等下把 key points 丟上來"},
          {type:'narration', text:"Alex 沒有回覆。Ken 的「等下」最終變成了下午四點才發的三行 bullet point。Sophie 在 Ken 回覆後打了一個 👍，沒有補充任何東西。"}
        ] },
      { label:"私訊 Ken 打聽", dm:{contact:'ken'}, sent:"Ken，上週五那個 alignment 是 formal meeting 還是 casual chat？我好像沒有收到 invite",
        fx:{ken:5, helpless:10}, route:'B',
        steps:[
          {type:'msg', speaker:'ken', text:"不是 meeting 啦"},
          {type:'msg', speaker:'ken', text:"就上週五下午 Alex 過來跟我聊了一下 Q3 想法"},
          {type:'msg', speaker:'ken', text:"她叫我之後跟 team sync，但我週末忘了 sorry"},
          {type:'msg', speaker:'ken', text:"方向大概就是 email 寫的那樣，conversion first，品牌的東西先 hold"},
          {type:'msg', speaker:'ken', text:"你先按你的理解做，我到時再 review"}
        ] },
      { label:"不問，直接照字面做", dm:{contact:'ken'}, sent:"（沒有多問，直接按字面理解開始做 timeline）",
        fx:{helpless:5}, route:'D',
        steps:[
          {type:'narration', text:"（Day 3）你把 timeline 整理好，附件傳給了 Ken。"},
          {type:'msg', speaker:'ken', text:"收到，我看看"},
          {type:'narration', text:"（Day 5，週五）"},
          {type:'msg', speaker:'ken', text:"Hey 我看了一下，方向大致 OK，但 Alex 的意思比較偏 CRM 和 lifecycle 那邊，不是 paid media"},
          {type:'msg', speaker:'ken', text:"你可以調一下嗎？下週一給我"},
          {type:'narration', text:"浪費了三天做了一個方向錯誤的東西。「CRM 和 lifecycle」這個關鍵字，上週五 Alex 跟 Ken 聊天時就已經存在了。"}
        ] },
      { label:"私訊 Alex 約 sync", dm:{contact:'alex'}, sent:"Hi Alex 早！想約個 15 分鐘 quick sync，確認一下 Q3 方向的細節，方便嗎？",
        fx:{like:5, helpless:20}, route:'A',
        steps:[
          {type:'narration', text:"[已讀]"},
          {type:'msg', speaker:'alex', text:"好啊，你看一下我 calendar 找個空檔"},
          {type:'narration', text:"她的 calendar 未來兩週幾乎全滿。唯一的空檔是下週四下午五點半。"},
          {type:'narration', text:"（Day 11，sync 之後）"},
          {type:'msg', speaker:'alex', text:"你就先按你的理解做吧，方向不會差太多的。有什麼問題隨時問 Ken，他比較清楚 day-to-day 的細節。"},
          {type:'msg', speaker:'alex', text:"還有其他嗎？"},
          {type:'narration', text:"17 分鐘。什麼具體資訊都沒拿到。她把你導回了 Ken。"}
        ] }
    ]
  },

  // 場景 1-2：茶水間（Day 4）
  {
    day:4, contact:'ken',
    incoming: [
      {speaker:'ken', text:"你上次 timeline 改好了沒？"},
      {side:'me', text:"改好了，按 CRM 方向重做了。"},
      {speaker:'ken', text:"嗯，Alex 最近比較⋯⋯你知道的。David 那邊一直在挑她東西，所以她有時候溝通比較 fragmentary，別 take it personally。"}

/* ============================================================
   結局文案
============================================================ */
const EPILOGUE = "不論你選了哪條路線——\nAlex 依然是你的（或曾經的）老闆。Ken 依然在（或已調走，依然安靜）。公司依然在運作。訊息斷層依然存在於世界上的每一間辦公室。\n\n你改變了嗎？改變了。\n你改變了它嗎？不確定。\n\n但你看見了它。";
const QUOTE = "「不是你不夠好。是你不在那個群組裡。」";

const endings = {
  A: { stamp:'neutral', stampLabel:'嫡系路線', title:'路線 A · 進入嫡系圈', last:"Leo DM 你：「下季方向是什麼？Alex 又沒說。」——你知道答案。" },
  B: { stamp:'restructure', stampLabel:'外部路線', title:'路線 B · 平行資訊網', last:"Joyce DM 你：「Alex 最近怎樣？」——你說「照舊。」" },
  C: { stamp:'promoted', stampLabel:'直言路線', title:'路線 C · 讓斷層曝光', last:"#mkt-team，Alex 發了一條 update——比以前多一條。" },
  D: { stamp:'resign', stampLabel:'離開路線', title:'路線 D · 離開', last:"新公司 Slack：歡迎加入 #team-all！所有成員都在這個頻道裡。" },
  E: { stamp:'hidden', stampLabel:'隱藏 · 被需要的人', title:'路線 E · 成為被需要的人', last:"Alex DM 你問 Q4 意見。同時 Leo DM 你問方向。" }
};

/* ============================================================
   DOM 參照
============================================================ */
const logEl = document.getElementById('log');
const choicesEl = document.getElementById('choices');
const continueWrap = document.getElementById('continueWrap');
const continueBtn = document.getElementById('continueBtn');
const dayLabel = document.getElementById('dayLabel');
const progressFill = document.getElementById('progressFill');
const topAvatar = document.getElementById('topAvatar');
const topName = document.getElementById('topName');
const topSub = document.getElementById('topSub');
const overlay = document.getElementById('overlay');
const notifSender = document.getElementById('notifSender');
const notifTitle = document.getElementById('notifTitle');
const notifText = document.getElementById('notifText');
const notifQuote = document.getElementById('notifQuote');
const notifStamp = document.getElementById('notifStamp');
const replayBtn = document.getElementById('replayBtn');
const statsPanel = document.getElementById('statsPanel');
const lightbox = document.getElementById('lightbox');
const lightboxCaption = document.getElementById('lightboxCaption');

lightbox.addEventListener('click', ()=> lightbox.classList.remove('show'));

document.querySelectorAll('.sb-item[data-contact]').forEach(el=>{
  el.addEventListener('click', ()=>{
    const key = el.getAttribute('data-contact');
    if(CONTACTS[key]) switchThread(key);
  });
});

function updateStatsPanel(){
  if(playCount < 2){ statsPanel.classList.remove('show'); return; }
  statsPanel.classList.add('show');
  const s = state;
  statsPanel.innerHTML = `
    <span class="stats-chip">Alex 好感度 ${s.like}</span>
    <span class="stats-chip">Alex 警惕值 ${s.wary}</span>
    <span class="stats-chip">Ken 關係 ${s.ken}</span>
    <span class="stats-chip">團隊同盟值 ${s.ally}</span>
    <span class="stats-chip">外部人脈 ${s.ext}</span>
    <span class="stats-chip">無力感 ${s.helpless}</span>
    <span class="stats-chip">路線傾向 A${routeScore.A} B${routeScore.B} C${routeScore.C} D${routeScore.D}</span>
  `;
}

/* ============================================================
   渲染引擎
============================================================ */
function renderMsgDOM(avatarKey, text, side){
  const c = CONTACTS[avatarKey] || CONTACTS.team;
  const row = document.createElement('div');
  row.className = 'msg-row ' + side;
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.style.background = side === 'me' ? '#9AA5B5' : c.color;
  avatar.textContent = side === 'me' ? '你' : c.initials;
  const body = document.createElement('div');
  body.className = 'msg-body';
  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.innerHTML = side === 'me' ? `<span class="nm">你（${ME_TITLE}）</span>` : `<span class="nm">${c.name}（${c.title}）</span>`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  body.appendChild(meta);
  body.appendChild(bubble);
  row.appendChild(avatar);
  row.appendChild(body);
  logEl.appendChild(row);
  logEl.scrollTop = logEl.scrollHeight;
}
function renderReadDOM(names){
  const div = document.createElement('div');
  div.className = 'read-receipt';
  div.textContent = `已讀 by ${names.join('、')}`;
  logEl.appendChild(div); logEl.scrollTop = logEl.scrollHeight;
}
function renderNarrationDOM(text){
  const div = document.createElement('div');
  div.className = 'narration';
  div.textContent = text;
  logEl.appendChild(div); logEl.scrollTop = logEl.scrollHeight;
}
function renderCallDOM(text){
  const div = document.createElement('div');
  div.className = 'call-notif';
  div.innerHTML = `<span class="icon">📞</span>${text}`;
  logEl.appendChild(div); logEl.scrollTop = logEl.scrollHeight;
}
function renderScreenshotDOM(avatarKey, caption, side, fullCaption){
  const c = CONTACTS[avatarKey] || CONTACTS.team;
  const row = document.createElement('div');
  row.className = 'msg-row ' + (side||'them');
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.style.background = c.color;
  avatar.textContent = c.initials;
  const body = document.createElement('div');
  body.className = 'msg-body';
  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.innerHTML = `<span class="nm">${c.name}（${c.title}）</span>`;
  const card = document.createElement('div');
  card.className = 'screenshot-card';
  card.innerHTML = `<div class="ss-fake">🖼️ 截圖</div><div class="ss-caption">${caption}</div>`;
  card.onclick = ()=>{ lightboxCaption.textContent = fullCaption || caption; lightbox.classList.add('show'); };
  body.appendChild(meta); body.appendChild(card);
  row.appendChild(avatar); row.appendChild(body);
  logEl.appendChild(row); logEl.scrollTop = logEl.scrollHeight;
}
function renderSilenceDOM(){
  const div = document.createElement('div');
  div.className = 'silence-pad';
  div.textContent = '・ ・ ・';
  logEl.appendChild(div); logEl.scrollTop = logEl.scrollHeight;
}
function renderRecord(r){
  if(r.kind === 'msg') renderMsgDOM(r.avatar, r.text, r.side);
  else if(r.kind === 'read') renderReadDOM(r.names);
  else if(r.kind === 'narration') renderNarrationDOM(r.text);
  else if(r.kind === 'call') renderCallDOM(r.text);
  else if(r.kind === 'screenshot') renderScreenshotDOM(r.avatar, r.caption, r.side, r.fullCaption);
  else if(r.kind === 'silence') renderSilenceDOM();
}
function pushRecord(threadKey, record){
  threads[threadKey].push(record);
  if(threadKey === currentThread){ renderRecord(record); }
}
function pushMsg(threadKey, avatarKey, text, side){
  pushRecord(threadKey, { kind:'msg', avatar:avatarKey, text, side });
}

function setActiveContact(key){
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.remove('active'));
  const c = CONTACTS[key];
  if(c.sb){ const el = document.getElementById(c.sb); if(el) el.classList.add('active'); }
  topAvatar.style.background = c.color;
  topAvatar.textContent = c.initials;
  topName.textContent = key==='team'||key==='crossdept'||key==='leadership'||key==='trio' ? c.name : `${c.name}（${c.title}）`;
  topSub.textContent = c.sub;
}

function switchThread(key, cb){
  if(key === currentThread){ if(cb) cb(); return; }
  logEl.classList.add('switching');
  setTimeout(()=>{
    currentThread = key;
    setActiveContact(key);
    logEl.innerHTML = '';
    if(threads[key].length){
      const divider = document.createElement('div');
      divider.className = 'thread-divider';
      divider.textContent = `與 ${CONTACTS[key].name} 的對話`;
      logEl.appendChild(divider);
    }
    threads[key].forEach(renderRecord);
    logEl.scrollTop = logEl.scrollHeight;
    requestAnimationFrame(()=>{ logEl.classList.remove('switching'); if(cb) cb(); });
  }, 150);
}

function randomTypingDelay(){
  return 3000 + Math.random() * 12000; // 3–15 秒不等，模擬真實回覆速度差異
}

function addTyping(contactKey){
  const c = CONTACTS[contactKey] || CONTACTS.team;
  const row = document.createElement('div');
  row.className = 'msg-row them typing-row';
  row.id = 'typingRow';
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.style.background = c.color;
  avatar.textContent = c.initials;
  const dots = document.createElement('div');
  dots.className = 'typing-dots';
  dots.innerHTML = '<span></span><span></span><span></span>';
  row.appendChild(avatar); row.appendChild(dots);
  logEl.appendChild(row); logEl.scrollTop = logEl.scrollHeight;
}
function removeTyping(){ const t = document.getElementById('typingRow'); if(t) t.remove(); }

function updateDay(day){
  dayLabel.textContent = `DAY ${day} / 90`;
  progressFill.style.width = Math.min(100, (day/90*100)) + '%';
}

function applyFx(fx, route){
  if(fx){ for(const k in fx){ state[k] = (state[k]||0) + fx[k]; } }
  if(route){ routeScore[route] = (routeScore[route]||0) + 1; }
  updateStatsPanel();
}

/* ---- 逐項播放 incoming（支援 narration / screenshot / call / 多說話者 / me） ---- */
function playIncoming(threadKey, items, i, cb){
  if(i >= items.length){ cb(); return; }
  const item = items[i];

  if(typeof item === 'string'){
    addTyping(threadKey);
    setTimeout(()=>{ removeTyping(); pushMsg(threadKey, threadKey, item, 'them'); setTimeout(()=>playIncoming(threadKey, items, i+1, cb), 380); }, randomTypingDelay());
    return;
  }
  if(item.narration){
    pushRecord(threadKey, { kind:'narration', text:item.narration });
    setTimeout(()=>playIncoming(threadKey, items, i+1, cb), 480);
    return;
  }
  if(item.call){
    pushRecord(threadKey, { kind:'call', text:item.call });
    setTimeout(()=>playIncoming(threadKey, items, i+1, cb), 480);
    return;
  }
  if(item.screenshot){
    addTyping(item.speaker || threadKey);
    setTimeout(()=>{
      removeTyping();
      pushRecord(threadKey, { kind:'screenshot', avatar:item.speaker||threadKey, caption:item.screenshot, side:'them', fullCaption:item.caption });
      setTimeout(()=>playIncoming(threadKey, items, i+1, cb), 400);
    }, randomTypingDelay());
    return;
  }
  if(item.side === 'me'){
    pushMsg(threadKey, threadKey, item.text, 'me');
    setTimeout(()=>playIncoming(threadKey, items, i+1, cb), 420);
    return;
  }
  // {speaker, text}
  addTyping(item.speaker || threadKey);
  setTimeout(()=>{
    removeTyping();
    pushMsg(threadKey, item.speaker || threadKey, item.text, 'them');
    setTimeout(()=>playIncoming(threadKey, items, i+1, cb), 380);
  }, randomTypingDelay());
}

/* ---- 步驟播放（choice.steps） ---- */
function runSteps(threadKey, steps, k, doneCb){
  if(!steps || k >= steps.length){ doneCb(); return; }
  const st = steps[k];
  if(st.type === 'narration'){ pushRecord(threadKey, {kind:'narration', text:st.text}); setTimeout(()=>runSteps(threadKey, steps, k+1, doneCb), 550); return; }
  if(st.type === 'silence'){ pushRecord(threadKey, {kind:'silence'}); setTimeout(()=>runSteps(threadKey, steps, k+1, doneCb), 1600); return; }
  addTyping(st.speaker || threadKey);
  setTimeout(()=>{
    removeTyping();
    pushMsg(threadKey, st.speaker || threadKey, st.text, 'them');
    setTimeout(()=>runSteps(threadKey, steps, k+1, doneCb), 380);
  }, randomTypingDelay());
}

function renderIncoming(ev, cb){
  switchThread(ev.contact, ()=>{
    if(ev.sub_override){ topSub.textContent = ev.sub_override; }
    updateDay(ev.day);
    playIncoming(ev.contact, ev.incoming, 0, ()=>{
      if(ev.readBy){
        setTimeout(()=>{ pushRecord(ev.contact, {kind:'read', names: ev.readBy}); afterMain(); }, 500);
      } else { afterMain(); }
    });
    function afterMain(){
      if(ev.interlude){
        switchThread(ev.interlude.contact, ()=>{
          let items = ev.interlude.exchange;
          function step(j){
            if(j >= items.length){
              if(ev.afterInterludeNarration){ pushRecord(ev.interlude.contact, {kind:'narration', text:ev.afterInterludeNarration}); }
              setTimeout(()=> switchThread(ev.contact, cb), 700);
              return;
            }
            const line = items[j];
            if(line.side === 'them'){
              addTyping(ev.interlude.contact);
              setTimeout(()=>{ removeTyping(); pushMsg(ev.interlude.contact, ev.interlude.contact, line.text, 'them'); setTimeout(()=>step(j+1), 380); }, randomTypingDelay());
            } else {
              pushMsg(ev.interlude.contact, ev.interlude.contact, line.text, 'me');
              setTimeout(()=>step(j+1), 420);
            }
          }
          step(0);
        });
      } else {
        cb();
      }
    }
  });
}

function renderChoices(list, onPick){
  choicesEl.innerHTML = '';
  choicesEl.classList.remove('hidden');
  const prompt = document.createElement('div');
  prompt.className = 'prompt';
  prompt.textContent = '選擇你的回應：';
  choicesEl.appendChild(prompt);
  list.forEach(choice=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice.label;
    btn.onclick = ()=>{ document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true); onPick(choice); };
    choicesEl.appendChild(btn);
  });
}

function selectChoice(ev, choice){
  applyFx(choice.fx, choice.route);
  const targetThread = choice.dm ? choice.dm.contact : ev.contact;

  function doSend(cb){
    if(choice.sentIsSilence){ pushRecord(targetThread, {kind:'silence'}); }
    else if(choice.sent){ pushMsg(targetThread, targetThread, choice.sent, 'me'); }
    if(choice.readByAfterSent){
      setTimeout(()=>{ pushRecord(targetThread, {kind:'read', names:choice.readByAfterSent}); setTimeout(cb, 400); }, 400);
    } else {
      setTimeout(cb, 350);
    }
  }

  function afterSteps(){
    if(choice.subChoices){
      renderChoices(choice.subChoices, (sc)=>{
        applyFx(sc.fx, sc.route);
        pushMsg(ev.contact, ev.contact, sc.sent, 'me');
        setTimeout(()=>{ runSteps(ev.contact, sc.steps, 0, ()=> finish()); }, 350);
      });
      return;
    }
    finish();
  }
  function finish(){
    if(choice.dm){ switchThread(ev.contact, showContinue); }
    else { showContinue(); }
  }

  function afterSwitch(){
    doSend(()=>{ runSteps(targetThread, choice.steps, 0, afterSteps); });
  }

  if(choice.dm){ switchThread(choice.dm.contact, afterSwitch); }
  else { afterSwitch(); }
}

function showContinue(){
  choicesEl.classList.add('hidden');
  continueWrap.style.display = 'block';
}

continueBtn.addEventListener('click', ()=>{
  continueWrap.style.display = 'none';
  idx++;
  loadNext();
});

function determineRoute(){
  const confronted = routeScore.C > 0;
  if(!confronted && state.like >= 55 && state.wary <= 5){ return 'E'; }
  if(routeScore.D >= 2){ return 'D'; }
  const order = [['A',routeScore.A],['C',routeScore.C],['B',routeScore.B],['D',routeScore.D]];
  order.sort((a,b)=> b[1]-a[1]);
  return order[0][1] > 0 ? order[0][0] : 'A';
}

function loadNext(){
  if(idx < events.length){
    const ev = events[idx];
    renderIncoming(ev, ()=>{
      if(ev.choices && ev.choices.length){
        renderChoices(ev.choices, (choice)=> selectChoice(ev, choice));
      } else {
        showContinue();
      }
    });
  } else if(!routeDecided){
    routeDecided = determineRoute();
    events = events.concat(buildRouteEvents(routeDecided));
    loadNext();
  } else {
    setTimeout(showEnding, 500);
  }
}

function showEnding(){
  const e = endings[routeDecided];
  notifSender.textContent = e.title;
  notifTitle.textContent = '90 天後';
  notifText.textContent = EPILOGUE + '\n\n最後一幕：' + e.last;
  notifQuote.textContent = QUOTE;
  notifStamp.textContent = e.stampLabel;
  notifStamp.className = 'notif-stamp ' + e.stamp;
  overlay.classList.add('show');
}

replayBtn.addEventListener('click', ()=>{
  state = { like:50, wary:0, ken:40, ally:30, ext:0, helpless:0 };
  routeScore = { A:0, B:0, C:0, D:0 };
  idx = 0;
  routeDecided = null;
  events = commonEvents.slice();
  playCount++;
  Object.keys(threads).forEach(k => threads[k] = []);
  currentThread = null;
  logEl.innerHTML = '';
  overlay.classList.remove('show');
  updateStatsPanel();
  loadNext();
});

/* ============================================================
   啟動
============================================================ */
events = commonEvents.slice();
loadNext();
</script>
